name: Deploy Frontend via Actions Directly

on:
  push:
    branches:
      - main # Укажите master, если главная ветка называется так
    paths:
      - 'frontend/**'

# Даем права, необходимые для деплоя напрямую через API GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем только один активный деплой одновременно
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build # Создает папку frontend/dist

      - name: Upload Page Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Указываем точный путь к папке сборки в монорепозитории
          path: './frontend/dist/'

      - name: Deploy to GitHub Pages Direct
        id: deployment
        uses: actions/deploy-pages@v4
